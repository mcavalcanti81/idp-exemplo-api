apiVersion: apps/v1
kind: Deployment
metadata:
  name: exemplo-api
  labels:
    app.kubernetes.io/name: exemplo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: exemplo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exemplo-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: exemplo-api  # substituído pelo digest da release (images: no kustomization)
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: base
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
